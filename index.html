<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bulk Sender - Professional</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0c0c0c 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(120, 219, 255, 0.1) 0%, transparent 50%);
            z-index: -1;
        }

        .cyber-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            backdrop-filter: blur(20px);
            background: rgba(15, 15, 30, 0.4);
            border: 1px solid rgba(123, 44, 191, 0.3);
            border-radius: 20px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            margin-top: 20px;
        }

        .cyber-title {
            font-family: 'Orbitron', monospace;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00, #00ffff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .cyber-btn {
            position: relative;
            overflow: hidden;
            border: 2px solid #00ffff;
            background: linear-gradient(45deg, rgba(123, 44, 191, 0.8), rgba(0, 255, 255, 0.2));
            color: #ffffff;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 15px 30px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 10px 25px rgba(0, 255, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .cyber-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 35px rgba(0, 255, 255, 0.4),
                0 0 30px rgba(0, 255, 255, 0.6);
            border-color: #ff00ff;
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .cyber-btn:hover::before {
            left: 100%;
        }

        .cyber-input, .cyber-textarea, .cyber-select {
            background: rgba(15, 15, 30, 0.8);
            border: 2px solid rgba(123, 44, 191, 0.5);
            color: #00ffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 500;
            padding: 15px 20px;
            margin-bottom: 20px;
            width: 100%;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 
                inset 0 4px 10px rgba(0, 0, 0, 0.3),
                0 2px 10px rgba(123, 44, 191, 0.2);
        }

        .cyber-input:focus, .cyber-textarea:focus, .cyber-select:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 
                inset 0 4px 15px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(0, 255, 255, 0.5),
                0 4px 15px rgba(0, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .cyber-input::placeholder, .cyber-textarea::placeholder {
            color: rgba(0, 255, 255, 0.6);
            font-style: italic;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-label {
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7b2cbf;
            font-size: 18px;
            pointer-events: none;
        }

        .file-upload-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border: 2px dashed rgba(123, 44, 191, 0.5);
            border-radius: 12px;
            background: rgba(15, 15, 30, 0.6);
            color: #00ffff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 80px;
        }

        .file-upload-label:hover {
            border-color: #00ffff;
            background: rgba(15, 15, 30, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .file-upload-icon {
            font-size: 24px;
            margin-right: 10px;
            color: #7b2cbf;
        }

        .file-name {
            color: #00ffff;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
            padding: 8px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .toggle-container {
            margin-bottom: 25px;
        }

        .toggle {
            position: relative;
            width: 100%;
            height: 60px;
            background: rgba(15, 15, 30, 0.8);
            border: 2px solid rgba(123, 44, 191, 0.5);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .toggle-label {
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            font-size: 16px;
            width: 50%;
            text-align: center;
            z-index: 2;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toggle input[type="radio"] {
            display: none;
        }

        .toggle-slider {
            position: absolute;
            top: 8px;
            left: 8px;
            width: calc(50% - 8px);
            height: 44px;
            background: linear-gradient(45deg, #7b2cbf, #00ffff);
            border-radius: 10px;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 
                0 4px 15px rgba(0, 255, 255, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        #targetTypeGroup:checked ~ .toggle-slider {
            transform: translateX(calc(100% + 8px));
        }

        #targetTypeInbox:checked ~ .toggle-label[for="targetTypeInbox"],
        #targetTypeGroup:checked ~ .toggle-label[for="targetTypeGroup"] {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        header {
            background: linear-gradient(135deg, rgba(15, 15, 30, 0.9), rgba(123, 44, 191, 0.2));
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(123, 44, 191, 0.3);
            padding: 30px 0;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: headerShine 4s infinite;
        }

        @keyframes headerShine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .form-section {
            background: rgba(15, 15, 30, 0.3);
            border: 1px solid rgba(123, 44, 191, 0.2);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .section-title {
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .stop-btn {
            background: linear-gradient(45deg, rgba(220, 20, 60, 0.8), rgba(255, 69, 0, 0.2));
            border-color: #ff4444;
        }

        .stop-btn:hover {
            border-color: #ff0000;
            box-shadow: 
                0 15px 35px rgba(255, 68, 68, 0.4),
                0 0 30px rgba(255, 0, 0, 0.6);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: rgba(15, 15, 30, 0.6);
            border: 1px solid rgba(123, 44, 191, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-number {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 900;
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .stat-label {
            color: #cccccc;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .cyber-container {
                margin: 10px;
                padding: 15px;
            }

            .form-section {
                padding: 20px;
            }

            .cyber-title {
                font-size: 24px;
            }

            .section-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1 class="cyber-title" style="font-size: 48px; margin-bottom: 10px;">
            <i class="fab fa-whatsapp" style="color: #25D366; margin-right: 15px;"></i>
            WhatsApp Bulk Sender
        </h1>
        <p style="color: #cccccc; font-size: 18px; font-weight: 300;">Professional Message Broadcasting System</p>
    </header>

    <div class="cyber-container">
        <!-- Main Send Form -->
        <div class="form-section">
            <form action="/send" method="post" enctype="multipart/form-data">
                <h2 class="section-title">
                    <i class="fas fa-paper-plane" style="margin-right: 10px;"></i>
                    Message Sender
                </h2>

                <!-- Credentials Upload -->
                <div class="input-group">
                    <label class="input-label">
                        <i class="fas fa-key" style="margin-right: 8px;"></i>
                        WhatsApp Credentials File
                    </label>
                    <div class="file-upload-wrapper">
                        <input type="file" class="file-upload-input" name="credsFile" accept=".json" required onchange="updateFileName(this, 'credsFileName')">
                        <label class="file-upload-label">
                            <i class="fas fa-cloud-upload-alt file-upload-icon"></i>
                            <span>Click to upload creds.json file</span>
                        </label>
                    </div>
                    <div class="file-name" id="credsFileName" style="display: none;"></div>
                </div>

                <!-- Messages File -->
                <div class="input-group">
                    <label class="input-label">
                        <i class="fas fa-file-alt" style="margin-right: 8px;"></i>
                        Messages File (.txt)
                    </label>
                    <div class="file-upload-wrapper">
                        <input type="file" class="file-upload-input" name="sms" accept=".txt" required onchange="updateFileName(this, 'smsFileName')">
                        <label class="file-upload-label">
                            <i class="fas fa-file-upload file-upload-icon"></i>
                            <span>Upload your messages text file</span>
                        </label>
                    </div>
                    <div class="file-name" id="smsFileName" style="display: none;"></div>
                </div>

                <!-- Sender Name -->
                <div class="input-group">
                    <label class="input-label">
                        <i class="fas fa-user-tag" style="margin-right: 8px;"></i>
                        Sender Name
                    </label>
                    <input type="text" class="cyber-input" name="hatersName" placeholder="Enter sender name (will be prefixed to messages)" required>
                    <i class="fas fa-user input-icon"></i>
                </div>

                <!-- Target Type Toggle -->
                <div class="toggle-container">
                    <label class="input-label" style="margin-bottom: 15px;">
                        <i class="fas fa-bullseye" style="margin-right: 8px;"></i>
                        Message Target Type
                    </label>
                    <div class="toggle">
                        <input type="radio" id="targetTypeInbox" name="messageTarget" value="inbox" checked onchange="toggleTargetInput()">
                        <label for="targetTypeInbox" class="toggle-label">
                            <i class="fas fa-user" style="margin-right: 5px;"></i>
                            Individual
                        </label>
                        <input type="radio" id="targetTypeGroup" name="messageTarget" value="group" onchange="toggleTargetInput()">
                        <label for="targetTypeGroup" class="toggle-label">
                            <i class="fas fa-users" style="margin-right: 5px;"></i>
                            Group
                        </label>
                        <div class="toggle-slider"></div>
                    </div>
                </div>

                <!-- Target Number Input -->
                <div id="targetNumberInput" class="input-group">
                    <label class="input-label">
                        <i class="fas fa-phone" style="margin-right: 8px;"></i>
                        Target Phone Number
                    </label>
                    <input type="text" class="cyber-input" name="targetNumber" placeholder="e.g: 994402197773 (without + or country code)" required>
                    <i class="fas fa-mobile-alt input-icon"></i>
                </div>

                <!-- Group ID Input -->
                <div id="groupIDInput" class="input-group" style="display: none;">
                    <label class="input-label">
                        <i class="fas fa-users" style="margin-right: 8px;"></i>
                        WhatsApp Group ID
                    </label>
                    <input type="text" class="cyber-input" name="groupID" placeholder="e.g: 120363401247079101@g.us">
                    <i class="fas fa-hashtag input-icon"></i>
                </div>

                <!-- Time Delay -->
                <div class="input-group">
                    <label class="input-label">
                        <i class="fas fa-clock" style="margin-right: 8px;"></i>
                        Message Interval (Seconds)
                    </label>
                    <input type="number" class="cyber-input" name="timeDelay" placeholder="Delay between messages (recommended: 5-10)" required min="1" max="3600">
                    <i class="fas fa-stopwatch input-icon"></i>
                </div>

                <button type="submit" class="cyber-btn" style="width: 100%; font-size: 18px; padding: 20px;">
                    <i class="fas fa-rocket" style="margin-right: 10px;"></i>
                    Start Broadcasting
                    <i class="fas fa-arrow-right" style="margin-left: 10px;"></i>
                </button>
            </form>
        </div>

        <!-- Stop Session Form -->
        <div class="form-section">
            <form action="/stop" method="post">
                <h2 class="section-title">
                    <i class="fas fa-stop-circle" style="margin-right: 10px; color: #ff4444;"></i>
                    Session Control
                </h2>

                <div class="input-group">
                    <label class="input-label">
                        <i class="fas fa-key" style="margin-right: 8px;"></i>
                        Session Key
                    </label>
                    <input type="text" class="cyber-input" name="sessionKey" placeholder="Enter session key to stop messaging" required>
                    <i class="fas fa-stop input-icon"></i>
                </div>

                <button type="submit" class="cyber-btn stop-btn" style="width: 100%; font-size: 18px; padding: 20px;">
                    <i class="fas fa-hand-paper" style="margin-right: 10px;"></i>
                    Stop Session
                    <i class="fas fa-times" style="margin-left: 10px;"></i>
                </button>
            </form>
        </div>

        <!-- Stats Section -->
        <div class="form-section">
            <h2 class="section-title">
                <i class="fas fa-chart-line" style="margin-right: 10px;"></i>
                System Statistics
            </h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="activeSessions">0</div>
                    <div class="stat-label">Active Sessions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalMessages">0</div>
                    <div class="stat-label">Messages Sent</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="uptime">00:00:00</div>
                    <div class="stat-label">Server Uptime</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.min.js"></script>
    <script>
        function toggleTargetInput() {
            const targetType = document.querySelector('input[name="messageTarget"]:checked').value;
            const targetNumberInput = document.getElementById('targetNumberInput');
            const groupIDInput = document.getElementById('groupIDInput');

            if (targetType === 'inbox') {
                targetNumberInput.style.display = 'block';
                groupIDInput.style.display = 'none';
                document.querySelector('input[name="groupID"]').removeAttribute('required');
                document.querySelector('input[name="targetNumber"]').setAttribute('required', '');
            } else {
                targetNumberInput.style.display = 'none';
                groupIDInput.style.display = 'block';
                document.querySelector('input[name="targetNumber"]').removeAttribute('required');
                document.querySelector('input[name="groupID"]').setAttribute('required', '');
            }
        }

        function updateFileName(input, elementId) {
            const fileNameElement = document.getElementById(elementId);
            if (input.files[0]) {
                fileNameElement.innerHTML = `
                    <i class="fas fa-check-circle" style="color: #00ff00; margin-right: 8px;"></i>
                    <strong>${input.files[0].name}</strong>
                    <span style="color: #888; margin-left: 10px;">(${(input.files[0].size / 1024).toFixed(2)} KB)</span>
                `;
                fileNameElement.style.display = 'block';
            } else {
                fileNameElement.style.display = 'none';
            }
        }

        // Initialize form
        document.addEventListener('DOMContentLoaded', function() {
            toggleTargetInput();

            // Fetch and update stats
            function updateStats() {
                fetch('/stats')
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('activeSessions').textContent = data.activeSessions;
                        // Calculate total messages sent across all sessions
                        const totalMessages = data.sessions.reduce((sum, session) => sum + (session.messagesSent || 0), 0);
                        document.getElementById('totalMessages').textContent = totalMessages;
                    })
                    .catch(error => {
                        console.log('Could not fetch stats:', error);
                    });
            }

            // Update stats every 5 seconds
            updateStats();
            setInterval(updateStats, 5000);

            // Simple uptime counter
            let startTime = Date.now();
            setInterval(function() {
                const uptime = Date.now() - startTime;
                const hours = Math.floor(uptime / (1000 * 60 * 60));
                const minutes = Math.floor((uptime % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((uptime % (1000 * 60)) / 1000);
                document.getElementById('uptime').textContent = 
                    `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        });

        // Enhanced form submission with validation
        document.querySelector('form[action="/send"]').addEventListener('submit', function(e) {
            e.preventDefault();

            const timeDelay = parseInt(document.querySelector('input[name="timeDelay"]').value);
            if (timeDelay < 5) {
                swal({
                    title: "Warning!",
                    text: "Time delay less than 5 seconds may cause WhatsApp to block your number. Continue anyway?",
                    type: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#ff9500",
                    confirmButtonText: "Yes, continue!",
                    cancelButtonText: "No, let me change it"
                }, function(isConfirm) {
                    if (isConfirm) {
                        submitForm();
                    }
                });
            } else {
                submitForm();
            }

            function submitForm() {
                swal({
                    title: "Start Broadcasting?",
                    text: "This will begin sending messages to the specified target. Make sure all information is correct.",
                    type: "info",
                    showCancelButton: true,
                    confirmButtonColor: "#7b2cbf",
                    confirmButtonText: "Start Broadcasting!",
                    cancelButtonText: "Cancel",
                    closeOnConfirm: false
                }, function(isConfirm) {
                    if (isConfirm) {
                        swal({
                            title: "Starting...",
                            text: "Initializing WhatsApp connection and preparing to send messages.",
                            type: "success",
                            timer: 2000,
                            showConfirmButton: false
                        });
                        setTimeout(() => {
                            e.target.submit();
                        }, 2000);
                    }
                });
            }
        });

        document.querySelector('form[action="/stop"]').addEventListener('submit', function(e) {
            e.preventDefault();
            swal({
                title: "Stop Session?",
                text: "This will immediately stop the messaging session and clean up all associated data.",
                type: "warning",
                showCancelButton: true,
                confirmButtonColor: "#ff4444",
                confirmButtonText: "Yes, stop it!",
                cancelButtonText: "Cancel",
                closeOnConfirm: false
            }, function(isConfirm) {
                if (isConfirm) {
                    swal({
                        title: "Stopping...",
                        text: "Terminating session and cleaning up resources.",
                        type: "success",
                        timer: 1500,
                        showConfirmButton: false
                    });
                    setTimeout(() => {
                        e.target.submit();
                    }, 1500);
                }
            });
        });
    </script>
</body>
</html>
